version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_products
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_dates
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: fct_orders
    columns:
      - name: row_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: region
        tests:
          - accepted_values:
              arguments:
                values: ['East', 'West', 'Central', 'South']